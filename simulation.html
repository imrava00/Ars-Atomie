<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulations · Ars Atomie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="data.js"></script>
<style>
  main{width:100%;max-width:820px;margin:0 auto;padding:26px 18px 44px}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .pagetitle{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .pagesub{color:var(--muted);margin:0;font-size:14px}
  .spacer{margin-left:auto}
  #timer{font-weight:700;color:var(--btn-ink);background:var(--primary);
    padding:5px 14px;border-radius:99px;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
  .prog{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 16px}
  #progFill{height:100%;width:0;border-radius:99px;background:var(--primary)}
  .qimg{max-width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--border)}
  .pick{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--border);
    border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;background:var(--surface);transition:.12s}
  .pick:hover{border-color:var(--ink)}
  .pick.sel{border-color:var(--primary);background:var(--primary-soft)}
  .letter{background:var(--surface);color:var(--muted);font-weight:700;border-radius:8px;width:29px;height:29px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;border:1px solid var(--border)}
  .pick.sel .letter{background:var(--primary);color:var(--btn-ink);border-color:var(--primary)}
  .optimg{max-height:110px;border-radius:8px;display:block;margin-top:6px;border:1px solid var(--border)}
  .dots{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
  .dot{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
    font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-family:inherit}
  .dot:hover{border-color:var(--ink);color:var(--ink)}
  .dot.done{background:var(--primary);color:var(--btn-ink);border-color:var(--primary);font-weight:700}
  .dot.cur{outline:2px solid var(--primary);outline-offset:2px}
  .scoreband{background:var(--primary-soft);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px 20px;text-align:center;margin-bottom:16px}
  #scoreBig{font-size:46px;font-weight:800;letter-spacing:-.03em}
  .rev{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:11px}
  .rev.ok{border-left:4px solid var(--primary)}
  .rev.bad{border-left:4px solid var(--hoverb)}
  .revhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .revtag{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px}
  .rev.ok .revtag{background:var(--primary);color:var(--btn-ink)}
  .rev.bad .revtag{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
  .revans{margin-top:9px;font-size:14px;display:flex;flex-direction:column;gap:6px}
  .expl{background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:9px 12px}
  .startwrap{max-width:360px;margin:0 auto;text-align:left}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <span class="mark"><svg class="ic"><use href="#i-logo"/></svg></span>
    <span class="bt"><span class="brand-name">Ars Atomie</span><span class="brand-sub">Simulations</span></span>
  </a>
  <nav class="nav">
    <a class="navlink" href="index.html">Home</a>
    <a class="navlink cur" href="simulation.html">Simulations</a>
    <a class="navlink" href="lecture.html">Lecture notes</a>
  </nav>
</header>

<main>
  <div id="listView">
    <div class="pagehead">
      <div>
        <span class="kicker">Practice</span>
        <h2 class="pagetitle">Simulations</h2>
        <p class="pagesub">Pick any simulation below. They are open to everyone.</p>
      </div>
      <button type="button" class="btn small" id="refreshBtn"><svg class="ic"><use href="#i-rotate"/></svg>Refresh</button>
    </div>
    <div class="grid" id="simGrid"></div>
  </div>

  <div class="card hidden" id="startCard" style="text-align:center;padding:32px 22px">
    <span class="kicker">Ready</span>
    <h2 id="stTitle" style="margin:8px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em"></h2>
    <p class="muted small" id="stMeta" style="margin:0 0 16px"></p>
    <div class="startwrap">
      <label class="field">Your name</label>
      <input type="text" id="stName" placeholder="Enter your full name">
    </div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button type="button" class="btn primary" id="startBtn"><svg class="ic"><use href="#i-play"/></svg>Start simulation</button>
      <button type="button" class="btn" id="backBtn1"><svg class="ic"><use href="#i-chev-l"/></svg>Back</button>
    </div>
  </div>

  <div class="card hidden" id="runView">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:10px">
        <button type="button" class="btn small" id="backBtn2"><svg class="ic"><use href="#i-chev-l"/></svg>Back</button>
        <b id="qCount"></b>
      </div>
      <span id="timer" class="hidden"><svg class="ic"><use href="#i-clock"/></svg><span id="timerTxt"></span></span>
    </div>
    <div class="prog"><div id="progFill"></div></div>
    <div id="qBody"></div>
    <div id="qOpts"></div>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button type="button" class="btn" id="prevBtn"><svg class="ic"><use href="#i-chev-l"/></svg>Previous</button>
      <button type="button" class="btn" id="nextBtn">Next<svg class="ic"><use href="#i-chev-r"/></svg></button>
      <button type="button" class="btn primary" id="submitBtn"><svg class="ic"><use href="#i-check"/></svg>Submit</button>
    </div>
  </div>

  <div class="hidden" id="resView">
    <div class="scoreband">
      <span class="kicker" id="resSim"></span>
      <div id="scoreBig"></div>
      <p class="muted" id="scoreMsg" style="margin:6px 0 0"></p>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:16px">
      <label class="row small" style="gap:7px;cursor:pointer;font-weight:600">
        <input type="checkbox" id="keyToggle">
        <svg class="ic"><use href="#i-key"/></svg> Show answer key for ALL questions
      </label>
    </div>
    <div class="chead" style="margin-bottom:10px">
      <h3 style="margin:0;font-size:15.5px;font-weight:700">Review and answer key</h3>
    </div>
    <div id="review"></div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button type="button" class="btn primary" id="retakeBtn"><svg class="ic"><use href="#i-rotate"/></svg>Take again</button>
      <button type="button" class="btn" id="backBtn3"><svg class="ic"><use href="#i-chev-l"/></svg>All simulations</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
const { el, esc, wire, icon, texToHtml, getContent, saveAttempt, getAttempts } = ARS;

let sim = null, quiz = null, timerInt = null;
let reviewAll = false, lastScore = 0, lastMax = 0, lastName = "";

function simMeta(s){
  const pts = s.questions.reduce((a,q)=>a+(q.points||0),0);
  return s.questions.length+" questions · "+pts+" points"+(s.durationMin>0?" · "+s.durationMin+" min time limit":"");
}
function showOnly(id){
  ["listView","startCard","runView","resView"].forEach(v=>el(v).classList.toggle("hidden", v!==id));
  window.scrollTo(0,0);
}
function renderList(){
  sim=null; quiz=null;
  if(timerInt){ clearInterval(timerInt); timerInt=null; el("timer").classList.add("hidden"); }
  const db = getContent();
  const grid = el("simGrid"); grid.innerHTML = "";
  if(!db.sims.length){
    grid.innerHTML = '<div class="empty">No simulations yet. Please check back later.</div>';
  }
  db.sims.forEach(s=>{
    const d = document.createElement("div"); d.className = "gcard";
    d.innerHTML = '<div class="chead"><div><b>'+texToHtml(s.title)+'</b><div class="small muted">'+simMeta(s)+'</div></div></div>'
      + (s.desc ? '<p class="small muted">'+texToHtml(s.desc)+'</p>' : '')
      + '<div class="row" style="margin-top:auto">'
      + '<button type="button" class="btn small primary" data-go>'+icon("play")+'Start</button></div>';
    d.querySelector("[data-go]").onclick = ()=>showStart(s);
    grid.appendChild(d);
  });
  showOnly("listView");
}
function showStart(s){
  sim = s;
  el("stTitle").innerHTML = texToHtml(s.title);
  el("stMeta").textContent = simMeta(s);
  el("stName").value = "";
  showOnly("startCard");
}
function startQuiz(){
  const name = el("stName").value.trim();
  if(!name){ alert("Please enter your name."); return; }
  lastName = name;
  quiz = { name, chosen:Array(sim.questions.length).fill(null), idx:0, finished:false };
  if(sim.durationMin>0){
    quiz.end = Date.now()+sim.durationMin*60000;
    el("timer").classList.remove("hidden");
    timerInt = setInterval(tick,500);
  }
  showOnly("runView");
  renderQuestion();
}
function tick(){
  const left = quiz.end - Date.now();
  if(left<=0){ alert("Time is up. Submitting your answers."); finishQuiz(); return; }
  el("timerTxt").textContent = Math.floor(left/60000)+":"+String(Math.floor(left%60000/1000)).padStart(2,"0");
}
function renderQuestion(){
  const q = sim.questions[quiz.idx], n = sim.questions.length;
  el("qCount").textContent = "Question "+(quiz.idx+1)+" of "+n;
  el("progFill").style.width = ((quiz.idx+1)/n*100)+"%";
  el("qBody").innerHTML = (q.text?'<div style="font-size:17px;font-weight:600;margin-bottom:6px">'+texToHtml(q.text)+'</div>':"")
    + (q.image?'<img class="qimg" src="'+q.image+'">':"");
  const box = el("qOpts"); box.innerHTML = "";
  q.options.forEach((o,i)=>{
    const b = document.createElement("div");
    b.className = "pick"+(quiz.chosen[quiz.idx]===i?" sel":"");
    b.innerHTML = '<span class="letter">'+String.fromCharCode(65+i)+'</span><div>'
      + (o.text?texToHtml(o.text):"")+(o.image?'<img class="optimg" src="'+o.image+'">':"")+'</div>';
    b.onclick = ()=>{ quiz.chosen[quiz.idx]=i; renderQuestion(); };
    box.appendChild(b);
  });
  const dots = el("dots"); dots.innerHTML = "";
  sim.questions.forEach((_,i)=>{
    const s2 = document.createElement("button");
    s2.type = "button";
    s2.className = "dot"+(quiz.chosen[i]!=null?" done":"")+(i===quiz.idx?" cur":"");
    s2.textContent = i+1;
    s2.onclick = ()=>{ quiz.idx=i; renderQuestion(); };
    dots.appendChild(s2);
  });
  el("prevBtn").disabled = quiz.idx===0;
  el("nextBtn").classList.toggle("hidden", quiz.idx===n-1);
  el("submitBtn").classList.toggle("hidden", quiz.idx!==n-1);
}
function finishQuiz(){
  if(timerInt){ clearInterval(timerInt); timerInt=null; el("timer").classList.add("hidden"); }
  quiz.finished = true;
  let score=0, max=0;
  sim.questions.forEach((q,i)=>{ max+=q.points; if(quiz.chosen[i]===q.correctIndex) score+=q.points; });
  saveAttempt({ simId:sim.id, simTitle:sim.title, name:quiz.name, score, max,
                date:new Date().toISOString(), answers:quiz.chosen.slice() });
  renderResults(score,max);
}
function optContent(q,i){
  const o = q.options[i];
  let h = '<b>'+String.fromCharCode(65+i)+'.</b> ';
  if(o.text) h += texToHtml(o.text);
  if(o.image) h += '<img class="optimg" src="'+o.image+'">';
  return h || "<i>(picture only)</i>";
}
function renderResults(score,max){
  lastScore=score; lastMax=max;
  showOnly("resView");
  el("resSim").textContent = sim.title;
  el("scoreBig").textContent = score+" / "+max;
  const pct = max?Math.round(score/max*100):0;
  el("scoreMsg").textContent = pct===100?"Perfect score!":pct>=70?"Great job! Review the ones you missed below.":"Keep practicing. Study the answer key below.";
  const box = el("review"); box.innerHTML = "";
  sim.questions.forEach((q,i)=>{
    const ok = quiz.chosen[i]===q.correctIndex;
    const d = document.createElement("div"); d.className = "rev "+(ok?"ok":"bad");
    d.innerHTML = '<div class="revhead">'+(ok?icon("check-c"):icon("x-c"))+' <b>Question '+(i+1)+'</b>'
      + '<span class="revtag">'+(ok?("+"+q.points+" pt"):("Correct answer: "+String.fromCharCode(65+q.correctIndex)))+'</span></div>'
      + (q.text?'<div class="small" style="margin-top:6px">'+texToHtml(q.text)+'</div>':"")
      + (q.image?'<img class="qimg" src="'+q.image+'">':"")
      + '<div class="revans">'
      + '<div><b>Your answer:</b> '+(quiz.chosen[i]==null?"<i>Not answered</i>":optContent(q,quiz.chosen[i]))+'</div>'
      + (!ok?'<div><b>Correct answer:</b> '+optContent(q,q.correctIndex)+'</div>':"")
      + (((!ok)||reviewAll)&&q.explanation?'<div class="expl"><b>Explanation:</b> '+texToHtml(q.explanation)+'</div>':"")
      + '</div>';
    box.appendChild(d);
  });
}
function tryLeave(){
  if(quiz && !quiz.finished && !confirm("Leave this simulation? Your answers will be discarded.")) return;
  quiz=null; renderList();
}

function init(){
  wire("refreshBtn","click",()=>renderList());
  wire("startBtn","click",startQuiz);
  wire("stName","keydown",e=>{ if(e.key==="Enter") startQuiz(); });
  wire("backBtn1","click",()=>renderList());
  wire("backBtn2","click",tryLeave);
  wire("backBtn3","click",()=>renderList());
  wire("prevBtn","click",()=>{ if(quiz.idx>0){ quiz.idx--; renderQuestion(); } });
  wire("nextBtn","click",()=>{ if(quiz.idx<sim.questions.length-1){ quiz.idx++; renderQuestion(); } });
  wire("submitBtn","click",()=>{
    const un = quiz.chosen.filter(c=>c==null).length;
    if(un && !confirm(un+" question(s) unanswered. Submit anyway?")) return;
    finishQuiz();
  });
  wire("keyToggle","change",e=>{ reviewAll = e.target.checked; renderResults(lastScore,lastMax); });
  wire("retakeBtn","click",()=>showStart(sim));
  renderList();
}
if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", init); }
else{ init(); }
</script>
</body>
</html>
